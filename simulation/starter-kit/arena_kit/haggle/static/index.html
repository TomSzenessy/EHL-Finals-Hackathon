<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haggle</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <h1>Haggle</h1>
  <div class="seg" role="group" aria-label="Arena" id="mode">
    <button data-mode="online">Online</button>
    <button data-mode="offline">Offline</button>
  </div>
  <label class="runpick">Session
    <select id="runs"></select>
  </label>
</header>
<nav role="tablist" id="tabs">
  <button role="tab" data-tab="negotiate">Negotiate</button>
  <button role="tab" data-tab="raw">Raw JSON</button>
  <button role="tab" data-tab="formatted">Formatted</button>
  <button role="tab" data-tab="suppliers">Suppliers</button>
</nav>
<main id="view"></main>
<script src="app.js"></script>
</body>
</html>
